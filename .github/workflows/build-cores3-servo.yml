name: Build CoreS3 Servo Firmware

on:
  push:
    branches: [ main ]
    paths:
      - 'main/boards/m5stack/core-s3/**'
      - '.github/workflows/build-cores3-servo.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build CoreS3 firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py -DIDF_TARGET=esp32s3 set-target esp32s3
          idf.py build
        env:
          BOARD_TYPE: M5STACK_CORE_S3

      - name: Merge binary
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          esptool.py --chip esp32s3 merge_bin \
            -o build/stackchan-servo-merged.bin \
            --flash_mode dio --flash_size 16MB \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/xiaozhi.bin
          ls -lh build/stackchan-servo-merged.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: stackchan-servo-firmware
          path: build/stackchan-servo-merged.bin
          retention-days: 30
