name: Build Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure board
        run: |
          cp sdkconfig.defaults.esp32s3 sdkconfig
          echo "CONFIG_BOARD_TYPE_M5STACK_CORE_S3=y" >> sdkconfig
          echo "CONFIG_SPIRAM_SPEED_40M=y" >> sdkconfig
          echo "# CONFIG_SPIRAM_SPEED_80M is not set" >> sdkconfig

      - name: Build
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-stackchan-servo-firmware
          path: |
            build/*.bin
            build/bootloader/*.bin
            build/partition_table/*.bin
            build/flasher_args.json
          retention-days: 30
